<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#F1ECE2"><title>VIENS — Batch availability</title><style>*{box-sizing:border-box}body{margin:0;background:#F1ECE2;color:#2B2420;font-family:Georgia,"Times New Roman",serif}.wrap{max-width:480px;margin:auto;padding:28px 18px 40px}h1{font-size:26px;margin:0 0 2px;letter-spacing:.04em}.sub{font:14px system-ui;color:#6B6058;margin-bottom:22px}.batch{background:#fff;border:1px solid rgba(43,36,32,.12);border-radius:14px;padding:16px 16px 6px;margin-bottom:14px}h2{font-size:18px;margin:0 0 10px}.row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;font:15px system-ui}.flavor-row{border-top:1px solid rgba(43,36,32,.08);padding-bottom:12px}.pill{font-size:13px;font-weight:600;padding:5px 12px;border-radius:999px;white-space:nowrap}.order-now{display:flex;align-items:center;justify-content:center;gap:7px;background:#2B2420;color:#fff;text-decoration:none;font:700 13px system-ui;padding:12px 14px;border-radius:9px;margin:4px 0 2px}.empty,.error{font:14px/1.5 system-ui;color:#6B6058}.foot{font:12px system-ui;color:#6B6058;margin-top:18px}</style></head><body><main class="wrap"><h1>VIENS</h1><div class="sub">Batch availability</div><div id="app" class="empty">Loading availability…</div><div id="updated" class="foot"></div></main><script>const API_URL = 'https://viens-availability.farsinchaluern.workers.dev/';,ORDER_URL='https://wa.link/j1znok';function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(d){const app=document.getElementById('app'),updated=document.getElementById('updated');if(d.error){app.innerHTML='<div class="error">Availability is temporarily unavailable. Please try again shortly.</div>';return}const C={AVAILABLE:['#E7F0E3','#3F7A52','Available'],'FEW LEFT':['#F6ECD9','#9A6A22','Few left'],'SOLD OUT':['#ECEAE6','#7A716A','Sold out']};let h='',ok=false;if(d.batches?.length){d.batches.forEach(b=>{h+='<section class="batch"><h2>'+esc(b.label)+'</h2>';(b.flavors||[]).forEach(f=>{let c=C[f.status]||C['SOLD OUT'];if(f.status!=='SOLD OUT')ok=true;h+='<div class="flavor-row"><div class="row"><span>'+esc(f.name)+'</span><span class="pill" style="background:'+c[0]+';color:'+c[1]+'">'+c[2]+'</span></div></div>'});h+='</section>'})}else h='<p class="empty">'+(d.todayBatchNotOpen?"Today's batch isn't open for orders yet — please check back soon.":'No batch today ('+esc(d.todayLabel)+') — please check back on our next batch day.')+'</p>';if(ok)h+='<a class="order-now" href="'+ORDER_URL+'" target="_blank" rel="noopener">Order Now <span>→</span></a>';app.innerHTML=h;updated.textContent='Updated '+(d.updated||'')+' (Vientiane time)'}function viensAvailability(d){render(d)}const s=document.createElement('script');s.src=API_URL+'?view=availability_api&callback=viensAvailability&_='+Date.now();s.onerror=()=>app.innerHTML='<div class="error">Availability is temporarily unavailable. Please try again shortly.</div>';document.head.appendChild(s)</script></body></html>
