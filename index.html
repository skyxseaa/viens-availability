<script>
const API_URL = 'https://script.google.com/macros/s/AKfycbwvfAeRbmJIV9XnWtLOjZ1lMiDEZXMb4uS8HVfjJWiILXPZEr1QDwhQHhsQpIY4O3m4/exec';

function viensAvailability(data) {
  renderAvailability(data);
}

function loadAvailability() {
  const script = document.createElement('script');

  script.src =
    API_URL +
    '?view=availability_api&callback=viensAvailability&_=' +
    Date.now();

  script.onerror = function () {
    document.getElementById('app').innerHTML =
      '<p class="empty">Unable to load availability. Please refresh.</p>';
  };

  document.body.appendChild(script);
}

function renderAvailability(data) {
  const app = document.getElementById('app');

  if (!data || !data.batches || !data.batches.length) {
    app.innerHTML =
      '<p class="empty">' +
      (data && data.todayBatchNotOpen
        ? "Today's batch isn't open for orders yet — please check back soon."
        : 'No batch available today.') +
      '</p>';

    return;
  }

  const statusClass = {
    'AVAILABLE': 'available',
    'FEW LEFT': 'few',
    'SOLD OUT': 'sold'
  };

  const statusText = {
    'AVAILABLE': 'Available',
    'FEW LEFT': 'Few left',
    'SOLD OUT': 'Sold out'
  };

  let html = '';

  data.batches.forEach(function(batch) {
    html += `
      <section class="batch">
        <h2>${escapeHtml(batch.label)}</h2>
    `;

    batch.flavors.forEach(function(flavor) {
      const cls = statusClass[flavor.status] || 'sold';
      const text = statusText[flavor.status] || flavor.status;

      html += `
        <div class="flavor-row">
          <div class="row">
            <span class="flavor">${escapeHtml(flavor.name)}</span>
            <span class="pill ${cls}">${text}</span>
          </div>
        </div>
      `;
    });

    html += '</section>';
  });

  const hasOrderable = data.batches.some(function(batch) {
    return batch.flavors.some(function(flavor) {
      return flavor.status !== 'SOLD OUT';
    });
  });

  if (hasOrderable) {
    html += `
      <a class="order-now"
         href="https://wa.link/j1znok"
         target="_blank"
         rel="noopener noreferrer">
        Order Now <span>→</span>
      </a>
    `;
  }

  html += `
    <div class="foot">
      Updated ${escapeHtml(data.updated)} (Vientiane time)
    </div>
  `;

  app.innerHTML = html;
}

function escapeHtml(value) {
  return String(value || '')
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#039;');
}

loadAvailability();
</script>
